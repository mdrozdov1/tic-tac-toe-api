<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic-Tac-Toe</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f0f1a;
      color: #e2e2e2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    h1 {
      font-size: 2.4rem;
      letter-spacing: 0.05em;
      color: #f0f0f0;
      margin-bottom: 0.25rem;
    }
    .subtitle { font-size: 0.9rem; color: #666; margin-bottom: 2rem; }

    /* ── Controls ─────────────────────────────────────────────── */
    .controls {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .controls label { font-size: 0.875rem; color: #888; }
    select {
      padding: 0.45rem 0.75rem;
      background: #1c1c2e;
      color: #e2e2e2;
      border: 1px solid #333;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
    }
    button {
      padding: 0.5rem 1.25rem;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
    .btn-primary { background: #e94560; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #c7304a; }

    /* ── Status ───────────────────────────────────────────────── */
    .status-bar {
      height: 2.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      gap: 0.5rem;
    }
    .status-bar.playing { color: #64b5f6; }
    .status-bar.win     { color: #66bb6a; }
    .status-bar.lose    { color: #ef5350; }
    .status-bar.draw    { color: #ffa726; }
    .status-bar .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: currentColor;
      animation: pulse 1.2s infinite;
    }
    .status-bar:not(.playing) .dot { display: none; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    /* ── Layout ───────────────────────────────────────────────── */
    .layout {
      display: flex;
      gap: 2rem;
      align-items: flex-start;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* ── Board ────────────────────────────────────────────────── */
    .board-container { display: flex; flex-direction: column; align-items: center; }
    #board {
      display: grid;
      gap: 5px;
      background: #2a2a3e;
      padding: 5px;
      border-radius: 10px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1c1c2e;
      border-radius: 6px;
      font-weight: 800;
      cursor: pointer;
      user-select: none;
      transition: background 0.12s, transform 0.1s;
    }
    .cell:hover:not(.taken):not(.disabled) {
      background: #252540;
      transform: scale(1.04);
    }
    .cell.x       { color: #e94560; cursor: default; }
    .cell.o       { color: #64b5f6; cursor: default; }
    .cell.taken   { cursor: default; transform: none !important; }
    .cell.disabled { cursor: default; }
    .cell.preview { background: #252540; }

    /* ── Sidebar ──────────────────────────────────────────────── */
    .sidebar {
      width: 230px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .sidebar-section h3 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #555;
      margin-bottom: 0.6rem;
    }
    .game-list {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      max-height: 420px;
      overflow-y: auto;
      padding-right: 2px;
    }
    .game-list::-webkit-scrollbar { width: 4px; }
    .game-list::-webkit-scrollbar-track { background: transparent; }
    .game-list::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

    .game-item {
      padding: 0.55rem 0.75rem;
      background: #1c1c2e;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.12s, border-color 0.12s;
    }
    .game-item:hover { background: #252540; }
    .game-item.active { border-color: #e94560; }
    .game-item-meta {
      font-size: 0.72rem;
      color: #555;
      margin-bottom: 0.2rem;
    }
    .game-item-status {
      font-size: 0.82rem;
      font-weight: 600;
    }
    .IN_PROGRESS { color: #64b5f6; }
    .X_WON       { color: #66bb6a; }
    .O_WON       { color: #ef5350; }
    .DRAW        { color: #ffa726; }

    .empty-hint { font-size: 0.82rem; color: #444; text-align: center; padding: 1rem; }

    /* ── Error toast ──────────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: #2d2d3e;
      color: #ef5350;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      font-size: 0.88rem;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      border: 1px solid #ef535044;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <h1>Tic-Tac-Toe</h1>
  <p class="subtitle">You are <strong id="playerSymbolDisplay" style="color:#e94560">X</strong> · Computer plays <strong style="color:#64b5f6">O</strong></p>

  <div class="controls">
    <label for="sizeSelect">Board size</label>
    <select id="sizeSelect">
      <option value="3" selected>3 × 3</option>
      <option value="4">4 × 4</option>
      <option value="5">5 × 5</option>
      <option value="6">6 × 6</option>
      <option value="7">7 × 7</option>
    </select>
    <label for="symbolSelect">Your piece</label>
    <select id="symbolSelect" onchange="changeSymbol(this.value)">
      <option value="X" selected>X</option>
      <option value="❌">❌</option>
      <option value="⭐">⭐</option>
      <option value="🔥">🔥</option>
      <option value="💎">💎</option>
      <option value="🦊">🦊</option>
      <option value="🤖">🤖</option>
      <option value="🐱">🐱</option>
    </select>
    <button class="btn-primary" id="newGameBtn" onclick="newGame()">New Game</button>
  </div>

  <div class="status-bar" id="statusBar">
    <span class="dot"></span>
    <span id="statusText"></span>
  </div>

  <div class="layout">
    <div class="board-container">
      <div id="board"></div>
    </div>

    <div class="sidebar">
      <div class="sidebar-section">
        <h3>Previous Games</h3>
        <div class="game-list" id="gameList">
          <div class="empty-hint">No games yet</div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    let currentGame = null;
    let busy = false;   // prevent double-clicks during in-flight request
    let playerSymbol = 'X';

    // ── Board parsing ──────────────────────────────────────────────
    // visual_board rows look like: "2 | . | X | O "
    // Returns rows[r][c] where r=0 is the top visual row (highest y).
    function parseBoard(visualBoard, size) {
      const result = [];
      for (const line of visualBoard.split('\n')) {
        const m = line.match(/^\d+\s*\|\s*(.+?)\s*$/);
        if (m) {
          result.push(m[1].split(/\s*\|\s*/).map(s => s.trim()));
        }
      }
      // Sanity-fill if parse produced wrong count
      while (result.length < size) result.push(Array(size).fill('.'));
      return result;
    }

    // ── Cell sizing ────────────────────────────────────────────────
    function cellSize(boardSize) {
      if (boardSize <= 3) return 90;
      if (boardSize <= 4) return 80;
      if (boardSize <= 5) return 70;
      if (boardSize <= 6) return 62;
      return 56;
    }
    function cellFont(boardSize) {
      if (boardSize <= 3) return '2.4rem';
      if (boardSize <= 5) return '2rem';
      return '1.6rem';
    }

    // ── Render board ───────────────────────────────────────────────
    function renderBoard(game) {
      const board = document.getElementById('board');
      const size = game.board_size;
      const rows = parseBoard(game.visual_board, size);
      const isOver = game.status !== 'IN_PROGRESS';
      const cs = cellSize(size);

      board.style.gridTemplateColumns = `repeat(${size}, ${cs}px)`;
      board.innerHTML = '';

      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.style.width  = cs + 'px';
          cell.style.height = cs + 'px';
          cell.style.fontSize = cellFont(size);

          const val = (rows[r] && rows[r][c]) ? rows[r][c] : '.';

          // Emoji glyphs render larger than letters; scale them down to fit.
          cell.style.fontSize = (val === 'X' && playerSymbol !== 'X')
            ? (parseFloat(cellFont(size)) * 0.72) + 'rem'
            : cellFont(size);

          if (val === 'X') {
            cell.textContent = playerSymbol;
            cell.classList.add('x', 'taken');
          } else if (val === 'O') {
            cell.textContent = 'O';
            cell.classList.add('o', 'taken');
          } else if (isOver) {
            cell.classList.add('disabled');
          } else {
            const row = r, col = c;
            cell.onclick = () => makeMove(row, col);
          }
          board.appendChild(cell);
        }
      }
    }

    // ── Status bar ─────────────────────────────────────────────────
    function updateStatus(game) {
      const bar  = document.getElementById('statusBar');
      const text = document.getElementById('statusText');
      bar.className = 'status-bar';
      const map = {
        IN_PROGRESS: ['playing', 'Your turn'],
        X_WON:       ['win',     'You won!'],
        O_WON:       ['lose',    'Computer wins'],
        DRAW:        ['draw',    "It's a draw"],
      };
      const [cls, msg] = map[game.status] || ['', game.status];
      bar.classList.add(cls);
      text.textContent = msg;
    }

    // ── Toast ──────────────────────────────────────────────────────
    let toastTimer;
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
    }

    // ── Symbol picker ──────────────────────────────────────────────
    function changeSymbol(sym) {
      playerSymbol = sym;
      document.getElementById('playerSymbolDisplay').textContent = sym;
      if (currentGame) renderBoard(currentGame);
    }

    // ── New game ───────────────────────────────────────────────────
    async function newGame() {
      const size = parseInt(document.getElementById('sizeSelect').value);
      const btn  = document.getElementById('newGameBtn');
      btn.disabled = true;
      try {
        const res  = await fetch('/games', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ board_size: size }),
        });
        if (!res.ok) { showToast('Failed to create game'); return; }
        const game = await res.json();
        currentGame = game;
        renderBoard(game);
        updateStatus(game);
        refreshGameList();
      } catch (e) {
        showToast('Network error');
      } finally {
        btn.disabled = false;
      }
    }

    // ── Make a move ────────────────────────────────────────────────
    async function makeMove(displayRow, displayCol) {
      if (!currentGame || currentGame.status !== 'IN_PROGRESS' || busy) return;
      busy = true;

      const size = currentGame.board_size;
      const x = displayCol;
      const y = (size - 1) - displayRow;

      try {
        const res = await fetch(`/games/${currentGame.id}/moves/`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ x, y }),
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          showToast(err.detail || 'Invalid move');
          return;
        }

        const game = await res.json();
        currentGame = game;
        renderBoard(game);
        updateStatus(game);
        if (game.status !== 'IN_PROGRESS') refreshGameList();
      } catch (e) {
        showToast('Network error');
      } finally {
        busy = false;
      }
    }

    // ── Game list ──────────────────────────────────────────────────
    const STATUS_LABEL = {
      IN_PROGRESS: 'In Progress',
      X_WON: 'You Won',
      O_WON: 'Computer Won',
      DRAW: 'Draw',
    };

    async function refreshGameList() {
      try {
        const res   = await fetch('/games');
        if (!res.ok) return;
        const games = await res.json();
        renderGameList(games);
      } catch (_) {}
    }

    function renderGameList(games) {
      const list = document.getElementById('gameList');
      list.innerHTML = '';

      if (!games.length) {
        list.innerHTML = '<div class="empty-hint">No games yet</div>';
        return;
      }

      // newest first
      for (const g of [...games].reverse()) {
        const item = document.createElement('div');
        const isActive = currentGame && g.id === currentGame.id;
        item.className = 'game-item' + (isActive ? ' active' : '');

        const d = new Date(g.created_at);
        const timeStr = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        item.innerHTML = `
          <div class="game-item-meta">Game #${g.id} · ${g.board_size}×${g.board_size} · ${g.move_count} moves · ${timeStr}</div>
          <div class="game-item-status ${g.status}">${STATUS_LABEL[g.status] || g.status}</div>
        `;
        item.onclick = () => selectGame(g);
        list.appendChild(item);
      }
    }

    function selectGame(g) {
      currentGame = g;
      renderBoard(g);
      updateStatus(g);
      // re-render list to update active highlight
      refreshGameList();
    }

    // ── Boot ───────────────────────────────────────────────────────
    (async () => {
      await refreshGameList();
      await newGame();
    })();
  </script>
</body>
</html>
